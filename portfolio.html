<!DOCTYPE html>
<html lang="fr">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Portfolio · Morgane BS Photographe</title>
    <meta name="description" content="Le portfolio de Morgane BS Photographe, photographe à Martigues. Portrait, couple, mariage et famille.">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <style>
/* =====================================================
   MORGANEBS - Photographe
   Direction artistique : editorial, clair, minimal
===================================================== */

@import url('https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,400;0,9..144,500;1,9..144,400;1,9..144,500&family=Inter:wght@300;400;500&display=swap');

:root {

    --paper:        #ffffff;
    --paper-soft:   #f2f1ec;
    --ink:          #16150f;
    --ink-soft:     #55534a;
    --line:         #dcdbd4;
    --line-strong:  #bebbb1;

    --display: "Fraunces", Georgia, "Times New Roman", serif;
    --body:    "Inter", system-ui, -apple-system, sans-serif;

    --page-x:  clamp(22px, 5.5vw, 130px);
    --maxw:    1680px;

    --ease:    cubic-bezier(.22, .61, .36, 1);

    /* Titre hero : s'adapte a la fois a la largeur ET la hauteur.
       min() prend la plus petite valeur -> jamais trop grand
       quand la fenetre est basse (paysage) ou etroite (mobile). */
    --hero-size:    min(15vh, 9vw, 8.4rem);
    --hero-size-sm: min(12vh, 13vw, 5rem);
}


* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html {
    scroll-behavior: smooth;
    -webkit-text-size-adjust: 100%;
}

body {
    background: var(--paper);
    color: var(--ink);
    font-family: var(--body);
    font-weight: 300;
    line-height: 1.6;
    overflow-x: hidden;
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
}

a { color: inherit; text-decoration: none; }

img { display: block; width: 100%; height: auto; }

::sélection { background: var(--ink); color: var(--paper); }

em { font-style: italic; font-weight: 400; }


.small {
    font-size: clamp(10px, .72vw, 11px);
    font-weight: 500;
    letter-spacing: .22em;
    text-transform: uppercase;
    color: var(--ink-soft);
}


/* =====================================================
   HEADER
===================================================== */

header {
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    z-index: 100;

    display: flex;
    align-items: center;
    justify-content: space-between;

    height: clamp(60px, 8vh, 80px);
    padding: 0 var(--page-x);

    color: var(--ink);
    background: transparent;
    border-bottom: 1px solid transparent;
    transition: background .5s var(--ease), border-color .5s var(--ease);
}

header.solid {
    background: color-mix(in srgb, var(--paper) 85%, transparent);
    -webkit-backdrop-filter: blur(14px);
    backdrop-filter: blur(14px);
    border-bottom: 1px solid var(--line);
}

.logo {
    display: inline-flex;
    align-items: center;
    gap: 12px;
    font-size: clamp(12px, .95vw, 13px);
    font-weight: 500;
    letter-spacing: .26em;
    text-transform: uppercase;
    white-space: nowrap;
}

.logo-img {
    width: auto;
    height: clamp(28px, 4vh, 38px);
    border-radius: 50%;
    object-fit: cover;
    aspect-ratio: 1 / 1;
    flex: none;
}

nav {
    display: flex;
    align-items: center;
    gap: clamp(20px, 3vw, 46px);
}

nav a {
    position: relative;
    font-size: clamp(12px, .95vw, 13px);
    font-weight: 400;
    letter-spacing: .04em;
    opacity: .74;
    transition: opacity .3s var(--ease);
}

nav a:hover,
nav a.active { opacity: 1; }

nav a:not(.appointment)::after {
    content: "";
    position: absolute;
    left: 0;
    bottom: -6px;
    width: 100%;
    height: 1px;
    background: currentColor;
    transform: scaleX(0);
    transform-origin: right;
    transition: transform .35s var(--ease);
}

nav a:not(.appointment):hover::after,
nav a.active:not(.appointment)::after {
    transform: scaleX(1);
    transform-origin: left;
}

nav a.appointment {
    padding: 9px 18px;
    border: 1px solid currentColor;
    border-radius: 999px;
    opacity: 1;
    transition: background .3s var(--ease), color .3s var(--ease);
}

nav a.appointment:hover {
    background: var(--ink);
    color: var(--paper);
}


.menu-toggle {
    display: none;
    flex-direction: column;
    gap: 5px;
    width: 26px;
    background: none;
    border: none;
    cursor: pointer;
    padding: 6px 0;
}

.menu-toggle span {
    display: block;
    height: 1.5px;
    width: 100%;
    background: currentColor;
    transition: transform .35s var(--ease), opacity .3s var(--ease);
}

body.nav-open .menu-toggle span:nth-child(1) { transform: translateY(6.5px) rotate(45deg); }
body.nav-open .menu-toggle span:nth-child(2) { opacity: 0; }
body.nav-open .menu-toggle span:nth-child(3) { transform: translateY(-6.5px) rotate(-45deg); }


/* =====================================================
   HERO plein ecran (fond degrade clair, sans image)
===================================================== */

.hero {
    position: relative;
    min-height: 100svh;
    width: 100%;
    display: flex;
    align-items: center;
    padding: clamp(90px, 14vh, 160px) var(--page-x) clamp(60px, 10vh, 120px);
    overflow: hidden;

    background:
        radial-gradient(130% 100% at 82% -8%, #ffffff 0%, rgba(255,255,255,0) 56%),
        radial-gradient(80% 60% at 6% 10%, #efeee9 0%, rgba(239,238,233,0) 62%),
        linear-gradient(165deg, #eeede8 0%, #e6e5df 40%, #deddd5 100%);
}

.hero-inner {
    position: relative;
    z-index: 2;
    width: 100%;
    max-width: var(--maxw);
    margin: 0 auto;
}

.hero-eyebrow {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    font-size: clamp(10px, .75vw, 11px);
    font-weight: 500;
    letter-spacing: .24em;
    text-transform: uppercase;
    color: var(--ink-soft);
    margin-bottom: clamp(22px, 4vh, 44px);
    opacity: 0;
    animation: fadeUp 1s var(--ease) .25s forwards;
}

.hero-eyebrow::before {
    content: "";
    width: clamp(24px, 3vw, 34px);
    height: 1px;
    background: var(--line-strong);
}

.hero-title {
    font-family: var(--display);
    font-weight: 300;
    font-size: var(--hero-size);
    line-height: .95;
    letter-spacing: -.02em;
    max-width: 18ch;
}

.hero-title span {
    display: block;
    opacity: 0;
    transform: translateY(26px);
    animation: fadeUp 1.1s var(--ease) forwards;
}

.hero-title span:nth-child(1) { animation-delay: .3s; }
.hero-title span:nth-child(2) { animation-delay: .42s; }
.hero-title span:nth-child(3) { animation-delay: .54s; }

.hero-title .accent { font-style: italic; font-weight: 400; }

@keyframes fadeUp { to { opacity: 1; transform: none; } }

.hero-foot {
    display: flex;
    align-items: flex-end;
    justify-content: space-between;
    gap: 24px;
    flex-wrap: wrap;
    margin-top: clamp(28px, 5vh, 54px);
    opacity: 0;
    animation: fadeUp 1s var(--ease) .8s forwards;
}

.hero-subtitle {
    max-width: 44ch;
    font-size: clamp(.95rem, 1.15vw, 1.12rem);
    line-height: 1.7;
    color: var(--ink-soft);
}

.hero-link {
    display: inline-flex;
    align-items: center;
    gap: 12px;
    font-size: clamp(13px, 1vw, 14px);
    letter-spacing: .02em;
    padding-bottom: 6px;
    border-bottom: 1px solid var(--ink);
    white-space: nowrap;
    transition: gap .35s var(--ease);
}

.hero-link:hover { gap: 18px; }

/* fleche de defilement discrete */
.hero-scroll {
    position: absolute;
    left: 50%;
    bottom: clamp(20px, 4vh, 34px);
    transform: translateX(-50%);
    z-index: 2;
    width: 1px;
    height: clamp(34px, 6vh, 54px);
    background: var(--line-strong);
    overflow: hidden;
    opacity: 0;
    animation: fadeUp 1s var(--ease) 1.2s forwards;
}

.hero-scroll::after {
    content: "";
    position: absolute;
    inset: 0;
    background: var(--ink);
    transform: translateY(-100%);
    animation: scrollTrail 2.6s var(--ease) infinite;
}

@keyframes scrollTrail {
    0%   { transform: translateY(-100%); }
    50%  { transform: translateY(0); }
    100% { transform: translateY(100%); }
}


/* =====================================================
   SECTIONS generiques
===================================================== */

.section {
    padding: 0 var(--page-x);
    max-width: var(--maxw);
    margin: 0 auto clamp(90px, 15vh, 200px);
}

.section-first {
    padding-top: clamp(80px, 14vh, 170px);
}

.section-head {
    display: flex;
    align-items: flex-end;
    justify-content: space-between;
    gap: 24px;
    flex-wrap: wrap;
    margin-bottom: clamp(40px, 7vh, 80px);
}

.section-label {
    font-size: clamp(10px, .72vw, 11px);
    font-weight: 500;
    letter-spacing: .22em;
    text-transform: uppercase;
    color: var(--ink-soft);
    margin-bottom: 14px;
}

.section-title {
    font-family: var(--display);
    font-weight: 300;
    font-size: clamp(2.1rem, 5.5vw, 4.6rem);
    line-height: 1.02;
    letter-spacing: -.015em;
}

.section-link {
    font-size: clamp(12px, 1vw, 13px);
    letter-spacing: .03em;
    color: var(--ink-soft);
    padding-bottom: 5px;
    border-bottom: 1px solid var(--line-strong);
    white-space: nowrap;
    transition: color .3s var(--ease), border-color .3s var(--ease);
}

.section-link:hover {
    color: var(--ink);
    border-color: var(--ink);
}


/* =====================================================
   GRILLE PORTFOLIO
===================================================== */

.portfolio-grid,
.portfolio-gallery {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: clamp(14px, 2vw, 38px);
}

.work {
    display: block;
    opacity: 0;
    transform: translateY(24px);
    transition: opacity .8s var(--ease), transform .8s var(--ease);
}

.work.in { opacity: 1; transform: none; }

.work-image {
    position: relative;
    overflow: hidden;
    background: var(--paper-soft);
    aspect-ratio: 4 / 5;
    border-radius: clamp(8px, 1vw, 14px);
}

.work-image img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    transition: transform 1.2s var(--ease);
}

.work:hover .work-image img { transform: scale(1.05); }

/* legende : uniquement la categorie, pas le nom de fichier */
.work-caption {
    margin-top: 14px;
}

.work-caption span {
    font-size: clamp(10px, .78vw, 11px);
    font-weight: 500;
    letter-spacing: .18em;
    text-transform: uppercase;
    color: var(--ink-soft);
}

.loading-note {
    grid-column: 1 / -1;
    padding: 60px 0;
    text-align: center;
    font-size: clamp(12px, 1vw, 13px);
    letter-spacing: .04em;
    color: var(--ink-soft);
}


/* =====================================================
   A PROPOS
===================================================== */

.about {
    padding: 0 var(--page-x);
    max-width: var(--maxw);
    margin: 0 auto clamp(90px, 15vh, 200px);
}

.about-inner {
    max-width: 34ch;
}

.about-text {
    font-family: var(--display);
    font-weight: 300;
    font-size: clamp(1.7rem, 3.6vw, 3.2rem);
    line-height: 1.16;
    letter-spacing: -.015em;
}

.about-small {
    margin-top: clamp(24px, 4vh, 40px);
    max-width: 54ch;
    font-size: clamp(.95rem, 1.1vw, 1.05rem);
    color: var(--ink-soft);
    line-height: 1.75;
}


/* =====================================================
   CONTACT (bloc sur accueil)
===================================================== */

.contact {
    padding: clamp(90px, 16vh, 220px) var(--page-x);
    max-width: var(--maxw);
    margin: 0 auto;
    border-top: 1px solid var(--line);
    text-align: center;
}

.contact .section-label { margin-bottom: 26px; }

.contact-title {
    font-family: var(--display);
    font-weight: 300;
    font-size: clamp(2.6rem, 7vw, 6.5rem);
    line-height: 1;
    letter-spacing: -.02em;
}

.contact-button {
    display: inline-flex;
    align-items: center;
    gap: 12px;
    margin-top: clamp(34px, 6vh, 60px);
    padding: 16px 36px;
    background: var(--ink);
    color: var(--paper);
    border-radius: 999px;
    font-size: clamp(13px, 1vw, 14px);
    letter-spacing: .03em;
    transition: transform .35s var(--ease), background .35s var(--ease);
}

.contact-button:hover { transform: translateY(-3px); background: #000; }


/* =====================================================
   FOOTER
===================================================== */

footer {
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 16px;
    padding: clamp(28px, 4vh, 38px) var(--page-x);
    max-width: var(--maxw);
    margin: 0 auto;
    border-top: 1px solid var(--line);
    font-size: clamp(11px, .9vw, 12px);
    letter-spacing: .04em;
    color: var(--ink-soft);
}

footer a { transition: color .3s var(--ease); }
footer a:hover { color: var(--ink); }


/* =====================================================
   REVEAL au scroll (sections)
===================================================== */

.reveal {
    opacity: 0;
    transform: translateY(30px);
    transition: opacity 1s var(--ease), transform 1s var(--ease);
    will-change: opacity, transform;
}

.reveal.is-visible { opacity: 1; transform: none; }


/* =====================================================
   RESPONSIVE
===================================================== */

@media (max-width: 1024px) {
    .portfolio-grid,
    .portfolio-gallery { grid-template-columns: repeat(2, 1fr); }
}

@media (max-width: 720px) {

    .logo {
        letter-spacing: .12em;
        font-size: 10.5px;
        gap: 9px;
    }

    .logo-img {
        height: 26px;
    }

    .hero-title { font-size: var(--hero-size-sm); }

    .menu-toggle { display: flex; }

    nav {
        position: fixed;
        inset: clamp(60px, 8vh, 80px) 0 auto 0;
        flex-direction: column;
        align-items: flex-start;
        gap: 4px;
        padding: 20px var(--page-x) 34px;
        background: var(--paper);
        color: var(--ink);
        border-bottom: 1px solid var(--line);
        transform: translateY(-12px);
        opacity: 0;
        pointer-events: none;
        transition: transform .35s var(--ease), opacity .3s var(--ease);
    }

    body.nav-open nav {
        transform: translateY(0);
        opacity: 1;
        pointer-events: auto;
    }

    nav a {
        width: 100%;
        padding: 14px 0;
        font-size: 17px;
        opacity: 1;
        border-bottom: 1px solid var(--line);
    }

    nav a:not(.appointment)::after { display: none; }

    nav a.appointment {
        margin-top: 16px;
        width: auto;
        border: 1px solid var(--ink);
        text-align: center;
    }

    .hero-foot { flex-direction: column; align-items: flex-start; }

    .section-head { align-items: flex-start; }

    .work-image { aspect-ratio: 3 / 4; }
}

@media (max-width: 480px) {
    .portfolio-grid,
    .portfolio-gallery { grid-template-columns: 1fr; gap: 26px; }
    .hero-scroll { display: none; }
}


/* =====================================================
   ACCESSIBILITE : mouvement reduit
===================================================== */

@media (prefers-reduced-motion: reduce) {
    * {
        animation-duration: .01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: .01ms !important;
        scroll-behavior: auto !important;
    }
    .reveal, .work { opacity: 1 !important; transform: none !important; }
    .hero-title span,
    .hero-eyebrow,
    .hero-foot,
    .hero-scroll { opacity: 1 !important; transform: none !important; animation: none !important; }
}

a:focus-visible,
button:focus-visible {
    outline: 2px solid currentColor;
    outline-offset: 3px;
}

/* =====================================================
   PAGE PORTFOLIO
===================================================== */

.portfolio-intro {
    padding: clamp(104px, 12vh, 140px) var(--page-x) clamp(36px, 6vh, 70px);
    max-width: var(--maxw);
    margin: 0 auto;
}

.portfolio-intro .small {
    display: inline-flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 22px;
}

.portfolio-intro .small::before {
    content: "";
    width: clamp(24px, 3vw, 34px);
    height: 1px;
    background: var(--line-strong);
}

.portfolio-intro h1 {
    font-family: var(--display);
    font-weight: 300;
    font-size: min(14vh, 8.5vw, 7rem);
    line-height: .98;
    letter-spacing: -.02em;
}

.filters {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    padding: 0 var(--page-x);
    max-width: var(--maxw);
    margin: 0 auto clamp(36px, 6vh, 64px);
}

.filter {
    font-family: var(--body);
    font-size: clamp(11px, .9vw, 12px);
    font-weight: 400;
    letter-spacing: .1em;
    text-transform: uppercase;
    color: var(--ink-soft);
    background: none;
    border: 1px solid var(--line-strong);
    border-radius: 999px;
    padding: 9px 20px;
    cursor: pointer;
    transition: color .3s var(--ease), background .3s var(--ease), border-color .3s var(--ease);
}

.filter:hover {
    color: var(--ink);
    border-color: var(--ink);
}

.filter.active {
    color: var(--paper);
    background: var(--ink);
    border-color: var(--ink);
}

.portfolio-gallery {
    padding: 0 var(--page-x);
    max-width: var(--maxw);
    margin: 0 auto clamp(90px, 15vh, 180px);
}

.portfolio-contact {
    padding: clamp(80px, 14vh, 180px) var(--page-x);
    max-width: var(--maxw);
    margin: 0 auto;
    border-top: 1px solid var(--line);
    text-align: center;
}

.portfolio-contact .small {
    display: block;
    margin-bottom: 24px;
}

.portfolio-contact h2 {
    font-family: var(--display);
    font-weight: 300;
    font-size: clamp(2.4rem, 7vw, 5.5rem);
    line-height: 1;
    letter-spacing: -.02em;
}

.portfolio-contact .link {
    display: inline-flex;
    align-items: center;
    gap: 12px;
    margin-top: clamp(28px, 5vh, 46px);
    font-size: clamp(13px, 1vw, 14px);
    letter-spacing: .02em;
    padding-bottom: 6px;
    border-bottom: 1px solid var(--ink);
    transition: gap .35s var(--ease);
}

.portfolio-contact .link:hover { gap: 18px; }
    </style>

</head>
