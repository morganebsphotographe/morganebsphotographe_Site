<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Page introuvable · Morgane BS Photographe</title>
    <!-- Favicon : plusieurs tailles, multiples de 48px, exigence de Google -->
    <link rel="icon" href="/favicon.ico" sizes="32x32">
    <link rel="icon" type="image/png" sizes="48x48" href="/favicon-48.png">
    <link rel="icon" type="image/png" sizes="96x96" href="/favicon-96.png">
    <link rel="icon" type="image/png" sizes="192x192" href="/favicon-192.png">
    <link rel="apple-touch-icon" href="/apple-touch-icon.png">
    <meta name="robots" content="noindex">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,400;1,9..144,400&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">

    <style>

        :root {
            --paper: #ffffff;
            --paper-soft: #f2f1ec;
            --ink: #16150f;
            --ink-soft: #55534a;
            --line: #dcdbd4;
            --line-strong: #bebbb1;

            --display: "Fraunces", Georgia, "Times New Roman", serif;
            --body: "Inter", system-ui, -apple-system, sans-serif;

            --page-x: clamp(22px, 5.5vw, 130px);
            --maxw: 1680px;

            --ease: cubic-bezier(.22, .61, .36, 1);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
            -webkit-text-size-adjust: 100%;
        }

        body {
            background: var(--paper);
            color: var(--ink);
            font-family: var(--body);
            font-weight: 300;
            line-height: 1.6;
            overflow-x: hidden;
            -webkit-font-smoothing: antialiased;
            text-rendering: optimizeLegibility;
        }

        a {
            color: inherit;
            text-decoration: none;
        }

        img {
            display: block;
            width: 100%;
            height: auto;
        }

        ::selection {
            background: var(--ink);
            color: var(--paper);
        }

        /* =========================
           APPARITION AU DEFILEMENT
        ========================= */

        .reveal {
            opacity: 0;
            transform: translateY(26px);
            transition: opacity .9s var(--ease), transform .9s var(--ease);
        }

        .reveal.is-visible {
            opacity: 1;
            transform: none;
        }

        .cards .card:nth-child(2) {
            transition-delay: .12s;
        }

        .info-grid .info:nth-child(2) {
            transition-delay: .1s;
        }

        /* =========================
           HEADER
        ========================= */

        header {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 100;

            display: flex;
            align-items: center;
            justify-content: space-between;

            height: clamp(60px, 8vh, 80px);
            padding: 0 var(--page-x);

            color: var(--ink);
            background: transparent;
            border-bottom: 1px solid transparent;
            transition: background .5s var(--ease), border-color .5s var(--ease);
        }

        header.solid {
            background: color-mix(in srgb, var(--paper) 85%, transparent);
            -webkit-backdrop-filter: blur(14px);
            backdrop-filter: blur(14px);
            border-bottom: 1px solid var(--line);
        }

        /* Logo + Instagram groupes a gauche */
        .brand {
            display: inline-flex;
            align-items: center;
            gap: clamp(6px, 1vw, 14px);
        }

        .logo {
            display: inline-flex;
            align-items: center;
            gap: 12px;

            font-size: clamp(12px, .95vw, 13px);
            font-weight: 500;
            letter-spacing: .26em;
            text-transform: uppercase;
            white-space: nowrap;
        }

        .logo-img {
            width: auto;
            height: clamp(28px, 4vh, 38px);
            border-radius: 50%;
            object-fit: cover;
            aspect-ratio: 1 / 1;
            flex: none;
        }

        nav {
            display: flex;
            align-items: center;
            gap: clamp(20px, 3vw, 46px);
        }

        nav a {
            position: relative;
            font-size: clamp(12px, .95vw, 13px);
            font-weight: 400;
            letter-spacing: .04em;
            opacity: .74;
            transition: opacity .3s var(--ease);
        }

        nav a:hover,
        nav a.active {
            opacity: 1;
        }

        nav a:not(.appointment)::after {
            content: "";
            position: absolute;
            left: 0;
            bottom: -6px;
            width: 100%;
            height: 1px;
            background: currentColor;
            transform: scaleX(0);
            transform-origin: right;
            transition: transform .35s var(--ease);
        }

        nav a:not(.appointment):hover::after,
        nav a.active:not(.appointment)::after {
            transform: scaleX(1);
            transform-origin: left;
        }

        nav a.appointment {
            padding: 9px 18px;
            border: 1px solid currentColor;
            border-radius: 999px;
            opacity: 1;
            white-space: nowrap;
            transition: background .3s var(--ease), color .3s var(--ease);
        }

        nav a.appointment:hover {
            background: var(--ink);
            color: var(--paper);
        }

        nav a.nav-cta {
            padding: 10px 20px;
            border-radius: 999px;
            background: var(--ink);
            color: var(--paper);
            opacity: 1;
            white-space: nowrap;
            transition: transform .35s var(--ease), background .35s var(--ease);
        }

        nav a.nav-cta:hover {
            background: #000;
            transform: translateY(-2px);
            color: var(--paper);
        }

        nav a.nav-cta::after {
            display: none;
        }

        /* Lien Instagram : icone monochrome */
        .nav-social {
            display: inline-flex;
            align-items: center;
            justify-content: center;

            width: 38px;
            height: 38px;
            flex: none;

            border-radius: 50%;
            color: var(--ink);
            opacity: .72;

            transition: opacity .3s var(--ease), background .3s var(--ease);
        }

        .nav-social:hover {
            opacity: 1;
            background: var(--paper-soft);
        }

        .nav-social svg {
            display: block;
            width: 19px;
            height: 19px;
        }

        .nav-social::after {
            display: none;
        }

        .menu-toggle {
            display: none;
            flex-direction: column;
            gap: 5px;
            width: 26px;
            background: none;
            border: none;
            cursor: pointer;
            padding: 6px 0;
        }

        .menu-toggle span {
            display: block;
            height: 1.5px;
            width: 100%;
            background: currentColor;
            transition: transform .35s var(--ease), opacity .3s var(--ease);
        }

        body.nav-open .menu-toggle span:nth-child(1) {
            transform: translateY(6.5px) rotate(45deg);
        }

        body.nav-open .menu-toggle span:nth-child(2) {
            opacity: 0;
        }

        body.nav-open .menu-toggle span:nth-child(3) {
            transform: translateY(-6.5px) rotate(-45deg);
        }

        /* =========================
           HERO
        ========================= */

        .hero {
            padding:
                clamp(92px, 12vh, 140px)
                var(--page-x)
                clamp(40px, 6vh, 70px);

            max-width: var(--maxw);
            margin: auto;
        }

        .hero-eyebrow {
            display: inline-flex;
            align-items: center;
            gap: 10px;

            font-size: clamp(10px, .72vw, 11px);
            font-weight: 500;
            letter-spacing: .22em;
            text-transform: uppercase;
            color: var(--ink-soft);
            margin-bottom: 30px;

            opacity: 0;
            animation: fadeUp 1s var(--ease) .2s forwards;
        }

        .hero-eyebrow::before {
            content: "";
            width: 34px;
            height: 1px;
            background: var(--line-strong);
        }

        .hero h1 {
            max-width: 1050px;
            font-family: var(--display);
            font-size: clamp(3.5rem, 8vw, 9rem);
            font-weight: 300;
            line-height: .94;
            letter-spacing: -.025em;
            text-wrap: balance;

            opacity: 0;
            transform: translateY(26px);
            animation: fadeUp 1.1s var(--ease) .3s forwards;
        }

        .hero h1 em {
            font-style: italic;
            font-weight: 400;
        }

        .hero-intro {
            max-width: 650px;
            margin-top: 45px;
            font-size: clamp(1rem, 1.25vw, 1.18rem);
            line-height: 1.75;
            color: var(--ink-soft);

            opacity: 0;
            animation: fadeUp 1s var(--ease) .55s forwards;
        }

        @keyframes fadeUp {
            to {
                opacity: 1;
                transform: none;
            }
        }

        /* =========================
           GENERAL
        ========================= */

        .container {
            max-width: var(--maxw);
            padding: 0 var(--page-x);
            margin: auto;
        }

        .section {
            padding: clamp(50px, 8vh, 100px) 0;
        }

        .section-head {
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            gap: 40px;
            margin-bottom: 65px;
        }

        .section-label {
            font-size: clamp(10px, .72vw, 11px);
            font-weight: 500;
            letter-spacing: .22em;
            text-transform: uppercase;
            color: var(--ink-soft);
            margin-bottom: 15px;
        }

        .section-title {
            font-family: var(--display);
            font-size: clamp(2.6rem, 5vw, 5.2rem);
            font-weight: 300;
            line-height: 1;
            letter-spacing: -.02em;
        }

        .section-description {
            max-width: 480px;
            color: var(--ink-soft);
            line-height: 1.75;
        }

        /* Puces communes a toutes les listes */
        .features,
        .wedding-list {
            list-style: none;
        }

        .features li,
        .wedding-list li {
            position: relative;
            padding-left: 20px;
            margin-bottom: 9px;
            color: var(--ink-soft);
        }

        .features li::before,
        .wedding-list li::before {
            content: "";
            position: absolute;
            left: 0;
            top: .75em;
            width: 5px;
            height: 5px;
            border-radius: 50%;
            background: var(--ink);
        }

        /* =========================
           SEANCE CARDS
        ========================= */

        .cards {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            border-top: 1px solid var(--line);
        }

        .card {
            display: flex;
            flex-direction: column;

            padding:
                40px
                clamp(20px, 4vw, 70px)
                50px 0;

            border-bottom: 1px solid var(--line);
        }

        .card:nth-child(2) {
            padding-left: clamp(20px, 4vw, 70px);
            border-left: 1px solid var(--line);
        }

        .card-media {
            overflow: hidden;
            border-radius: clamp(8px, 1vw, 14px);
            background: var(--paper-soft);
            margin-bottom: 32px;
        }

        .card-media img {
            width: 100%;
            height: 100%;
            aspect-ratio: 3 / 2;
            object-fit: cover;
            transition: transform 1.2s var(--ease);
        }

        .card:hover .card-media img {
            transform: scale(1.04);
        }

        .card-title-row {
            display: flex;
            align-items: baseline;
            flex-wrap: wrap;
            gap: 16px;
        }

        .card h3 {
            margin-bottom: 8px;
            font-family: var(--display);
            font-size: clamp(2.4rem, 4vw, 4rem);
            font-weight: 400;
            line-height: 1;
        }

        .badge {
            padding: 6px 13px;
            border: 1px solid var(--line-strong);
            border-radius: 999px;
            font-size: 10px;
            font-weight: 500;
            letter-spacing: .18em;
            text-transform: uppercase;
            color: var(--ink-soft);
            white-space: nowrap;
        }

        .price {
            margin-top: 14px;
            font-family: var(--display);
            font-size: clamp(2rem, 3vw, 3rem);
            font-weight: 300;
        }

        .card-intro {
            max-width: 600px;
            margin-top: 28px;
            color: var(--ink-soft);
            line-height: 1.75;
        }

        .card-intro strong {
            color: var(--ink);
            font-weight: 400;
        }

        .ideal {
            margin-top: 30px;
            margin-bottom: 10px;
            font-size: 11px;
            font-weight: 500;
            letter-spacing: .18em;
            text-transform: uppercase;
        }

        .ideal-text {
            color: var(--ink-soft);
        }

        .features {
            margin-top: 30px;
        }

        /* Colle les deux mentions "photo supplementaire" sur la meme ligne de base */
        .extra {
            margin-top: auto;
            padding-top: 35px;
            font-size: 13px;
            color: var(--ink-soft);
        }

        /* =========================
           MARIAGES
        ========================= */

        .wedding-section {
            background: var(--paper-soft);
            padding: clamp(70px, 9vw, 130px) 0;
        }

        .wedding-card {
            padding: clamp(35px, 5vw, 75px);
            background: var(--paper);
            border: 1px solid var(--line);
        }

        .wedding-card + .wedding-card {
            margin-top: 25px;
        }

        .wedding-media {
            overflow: hidden;
            background: var(--paper-soft);
            margin:
                calc(-1 * clamp(35px, 5vw, 75px))
                calc(-1 * clamp(35px, 5vw, 75px))
                clamp(40px, 5vw, 60px);
        }

        .wedding-media img {
            width: 100%;
            height: 100%;
            aspect-ratio: 2 / 1;
            object-fit: cover;
            transition: transform 1.4s var(--ease);
        }

        .wedding-card:hover .wedding-media img {
            transform: scale(1.03);
        }

        .wedding-grid {
            display: grid;
            grid-template-columns: minmax(250px, .8fr) 1.2fr;
            gap: clamp(45px, 8vw, 120px);
        }

        .wedding-card h3 {
            margin-top: 15px;
            font-family: var(--display);
            font-size: clamp(2.5rem, 4.5vw, 4.8rem);
            font-weight: 400;
            line-height: 1;
        }

        .wedding-description {
            margin-top: 22px;
            max-width: 500px;
            color: var(--ink-soft);
            line-height: 1.75;
        }

        .wedding-description strong {
            color: var(--ink);
            font-weight: 400;
        }

        .wedding-price {
            margin-top: 35px;
            font-family: var(--display);
            font-size: clamp(2rem, 3vw, 3rem);
        }

        .sub-title {
            margin-bottom: 15px;
            font-size: 11px;
            font-weight: 500;
            letter-spacing: .18em;
            text-transform: uppercase;
        }

        .wedding-list {
            margin-bottom: 35px;
        }

        /* =========================
           INFOS
        ========================= */

        .info-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            border-top: 1px solid var(--line);
            border-bottom: 1px solid var(--line);
        }

        .info-grid--spaced {
            margin-top: 70px;
        }

        .info {
            padding: 55px 0;
        }

        .info + .info {
            padding-left: clamp(25px, 6vw, 100px);
            border-left: 1px solid var(--line);
        }

        .info h3 {
            margin-bottom: 18px;
            font-family: var(--display);
            font-size: clamp(2rem, 3vw, 3rem);
            font-weight: 400;
        }

        .info p {
            max-width: 650px;
            color: var(--ink-soft);
            line-height: 1.8;
        }

        /* =========================
           QUESTIONS FREQUENTES
        ========================= */

        .faq {
            max-width: 900px;
        }

        .faq-item {
            border-bottom: 1px solid var(--line);
        }

        .faq-item:first-of-type {
            border-top: 1px solid var(--line);
        }

        .faq-item summary {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 24px;

            padding: 26px 0;
            cursor: pointer;
            list-style: none;

            font-family: var(--display);
            font-size: clamp(1.1rem, 1.6vw, 1.45rem);
            font-weight: 400;
            transition: color .3s var(--ease);
        }

        .faq-item summary::-webkit-details-marker {
            display: none;
        }

        .faq-item summary::after {
            content: "";
            flex: none;
            width: 11px;
            height: 11px;
            border-right: 1px solid var(--ink-soft);
            border-bottom: 1px solid var(--ink-soft);
            transform: rotate(45deg) translate(-3px, -3px);
            transition: transform .35s var(--ease);
        }

        .faq-item[open] summary::after {
            transform: rotate(-135deg) translate(-3px, -3px);
        }

        .faq-item summary:hover {
            color: var(--ink-soft);
        }

        .faq-answer {
            padding-bottom: 28px;
            max-width: 700px;
            color: var(--ink-soft);
            line-height: 1.8;
        }

        /* =========================
           CTA
        ========================= */

        .cta-section {
            padding:
                clamp(90px, 12vw, 170px)
                var(--page-x);

            background: var(--ink);
            color: var(--paper);
            text-align: center;
        }

        .cta-section h2 {
            max-width: 900px;
            margin: auto;
            font-family: var(--display);
            font-size: clamp(3rem, 6vw, 6.5rem);
            font-weight: 300;
            line-height: .98;
            text-wrap: balance;
        }

        .cta-section p {
            max-width: 600px;
            margin: 30px auto;
            color: #c9c9c9;
        }

        .cta-button {
            display: inline-flex;
            margin-top: 15px;
            padding: 13px 25px;
            border: 1px solid var(--paper);
            border-radius: 999px;
            transition: background .3s var(--ease), color .3s var(--ease);
        }

        .cta-button:hover {
            background: var(--paper);
            color: var(--ink);
        }

        /* =========================
           FOOTER
        ========================= */

        footer {
            display: flex;
            justify-content: space-between;
            gap: 25px;
            padding: 30px var(--page-x);
            background: var(--paper);
            border-top: 1px solid var(--line);
            font-size: 12px;
            color: var(--ink-soft);
        }

        /* =========================
           ACCESSIBILITE
        ========================= */

        a:focus-visible,
        button:focus-visible,
        summary:focus-visible {
            outline: 2px solid currentColor;
            outline-offset: 3px;
        }

        @media (prefers-reduced-motion: reduce) {
            * {
                animation-duration: .01ms !important;
                animation-iteration-count: 1 !important;
                transition-duration: .01ms !important;
                scroll-behavior: auto !important;
            }

            .reveal {
                opacity: 1 !important;
                transform: none !important;
            }

            .hero h1,
            .hero-eyebrow,
            .hero-intro {
                opacity: 1 !important;
                transform: none !important;
                animation: none !important;
            }
        }

        /* =========================
           RESPONSIVE
        ========================= */

        @media (max-width: 720px) {

            nav {
                position: fixed;
                inset: clamp(60px, 8vh, 80px) 0 auto 0;
                flex-direction: column;
                align-items: flex-start;
                gap: 4px;
                padding: 20px var(--page-x) 34px;
                background: var(--paper);
                color: var(--ink);
                border-bottom: 1px solid var(--line);
                transform: translateY(-12px);
                opacity: 0;
                pointer-events: none;
                transition: transform .35s var(--ease), opacity .3s var(--ease);
            }

            body.nav-open nav {
                transform: translateY(0);
                opacity: 1;
                pointer-events: auto;
            }

            /* Icone Instagram plus compacte a cote du logo */
            .nav-social {
                width: 30px;
                height: 30px;
            }

            .nav-social svg {
                width: 16px;
                height: 16px;
            }

            .logo {
                letter-spacing: .12em;
                font-size: 10.5px;
                gap: 9px;
            }

            .logo-img {
                height: 26px;
            }

            .menu-toggle {
                display: flex;
            }

            nav a {
                width: 100%;
                padding: 14px 0;
                font-size: 17px;
                opacity: 1;
                border-bottom: 1px solid var(--line);
            }

            nav a:not(.appointment)::after {
                display: none;
            }

            nav a.appointment {
                width: auto;
                margin-top: 16px;
                border: 1px solid var(--ink);
                text-align: center;
            }

            nav a.nav-cta {
                width: auto;
                margin-top: 10px;
                border: none;
                border-bottom: none;
                text-align: center;
            }

            .hero {
                padding-top: 125px;
            }

            .hero h1 {
                font-size: clamp(3.3rem, 14vw, 6rem);
            }

            .section-head {
                display: block;
            }

            .section-description {
                margin-top: 25px;
            }

            .cards {
                grid-template-columns: 1fr;
            }

            .card {
                padding: 40px 0 55px;
            }

            .card:nth-child(2) {
                padding-left: 0;
                border-left: 0;
                transition-delay: 0s;
            }

            .wedding-media img {
                aspect-ratio: 3 / 2;
            }

            .wedding-grid {
                grid-template-columns: 1fr;
                gap: 45px;
            }

            .info-grid {
                grid-template-columns: 1fr;
            }

            .info + .info {
                padding-left: 0;
                border-left: 0;
                border-top: 1px solid var(--line);
                transition-delay: 0s;
            }
        }

        @media (max-width: 600px) {

            .hero {
                padding-bottom: 50px;
            }

            .hero-intro {
                margin-top: 25px;
            }

            .section {
                padding: 60px 0;
            }

            .section-head {
                margin-bottom: 45px;
            }

            .wedding-section {
                padding: 60px 0;
            }

            .wedding-card {
                padding: 30px 22px;
            }

            .info {
                padding: 40px 0;
            }

            .info-grid--spaced {
                margin-top: 35px;
            }

            .cta-section {
                padding-top: 80px;
                padding-bottom: 80px;
            }

            footer {
                flex-direction: column;
            }
        }

        @media (max-width: 400px) {

            /* Tres petits ecrans : on resserre pour degager le bouton menu */
            .logo {
                font-size: 9.5px;
                letter-spacing: .08em;
                gap: 7px;
            }

            .brand {
                gap: 2px;
            }

            .nav-social {
                width: 26px;
                height: 26px;
            }

            .nav-social svg {
                width: 15px;
                height: 15px;
            }
        }
    

        .notfound {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;

            min-height: 78vh;
            padding: clamp(120px, 16vh, 200px) var(--page-x) clamp(60px, 10vh, 120px);
        }

        .notfound h1 {
